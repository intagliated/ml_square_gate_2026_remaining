        { id: "Q.58", section: "Q.36 – Q.65 Carry TWO marks Each", text: "Consider the given Python program.<br><pre>def fun(L, i=0):\n    if i >= len(L)-1:\n        return 0\n    if L[i] > L[i+1]:\n        L[i+1], L[i] = L[i], L[i+1]\n        return 1 + fun(L, i+1)\n    else:\n        return fun(L, i+1)\ndata = [5, 3, 4, 1, 2]\ncount = 0\nfor _ in range(len(data)):\n    count += fun(data)\nprint(count)</pre>The output of the program is __________. (Answer in integer)", options: [] },

        { id: "Q.60", section: "Q.36 – Q.65 Carry TWO marks Each", text: "Consider the table 'Account' given below:<br><table border='1'><tr><th>AccNo</th><th>Balance</th></tr><tr><td>A1</td><td>5000</td></tr><tr><td>A2</td><td>5000</td></tr><tr><td>A3</td><td>10000</td></tr><tr><td>A4</td><td>15000</td></tr><tr><td>A5</td><td>18000</td></tr></table><br>Consider the given SQL query: SELECT AccNo FROM Account AS A WHERE (SELECT COUNT(*) FROM Account AS B WHERE A.Balance < B.Balance) >= (SELECT COUNT(*) FROM Account AS C WHERE A.Balance > C.Balance)<br>The number of rows returned by the SQL query is __________. (Answer in integer)", options: [] },

    let currentIndex = 0;

    function init() {
        renderNavBar();
        showQuestion(0);
        
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentIndex > 0) showQuestion(currentIndex - 1);
        });
        
        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentIndex < questions.length - 1) showQuestion(currentIndex + 1);
        });
    }

    function renderNavBar() {
        const navBar = document.getElementById('navBar');
        questions.forEach((q, index) => {
            const btn = document.createElement('button');
            btn.className = 'nav-btn';
            btn.textContent = q.id;
            btn.onclick = () => showQuestion(index);
            navBar.appendChild(btn);
        });
    }

    function showQuestion(index) {
        currentIndex = index;
        const q = questions[index];
        
        // Update Nav Buttons
        const buttons = document.querySelectorAll('.nav-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        if(buttons[index]) buttons[index].classList.add('active');

        // Update Counter
        document.getElementById('questionCounter').textContent = `Question ${index + 1} of ${questions.length}`;

        // Render Content
        let html = `<div class="section-header">${q.section}</div>`;
        html += `<div class="question-text"><b>${q.id}</b><br>${q.text}</div>`;
        
        if (q.options && q.options.length > 0) {
            html += `<table class="options-table">`;
            q.options.forEach(opt => {
                html += `<tr><td>${opt[0]}</td><td>${opt[1]}</td></tr>`;
            });
            html += `</table>`;
        } else {
            html += `<p><i>(Numerical Answer Type)</i></p>`;
        }

        document.getElementById('questionContent').innerHTML = html;
    }

    // Run initialization
    window.onload = init;
</script>

</body>
</html>
